name: "Smart Wardrobe AI"
version: "0.4.0"
slug: "smart_wardrobe_ai"
description: "Analyse les photos de vêtements de Smart Wardrobe avec Gemini ; garde la clé d'API hors de l'application"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
map:
  - ssl
ports:
  8095/tcp: 8095
ports_description:
  8095/tcp: "API de l'application (HTTPS si ssl est activé)"

options:
  gemini_api_key: ""
  gemini_model: "gemini-3.8-flash"
  app_token: ""
  effort: "low"
  daily_limit: 200
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem

schema:
  gemini_api_key: password?
  gemini_model: list(gemini-3.8-flash|gemini-3.5-flash-lite|gemini-3.1-flash-lite)
  app_token: password
  effort: list(low|medium|high)
  daily_limit: int(1,5000)
  ssl: bool
  certfile: str
  keyfile: str
